name: JITEM production 1171 proof
on:
  push:
    branches: [qa/jitem-production-1171]
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Verify live www lifecycle and memory boundaries
        env:
          ATLAS_BROWSER_OUT: ${{ runner.temp }}/jitem-production-proof
        run: |
          node --experimental-strip-types scripts/jitem-production-acceptance.ts
          node scripts/production-quality-browser.mjs https://www.tariklab.com/games/jitem-derin-ag
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jitem-production-1171-proof
          path: ${{ runner.temp }}/jitem-production-proof
          if-no-files-found: error
